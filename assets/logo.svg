  <path d="M286 418 L214 528 H262 L242 606 L314 492 H266 Z" fill="#fff"/>
  <!-- 2 bước xử lý -->
  <rect x="590" y="218" width="236" height="200" rx="52" fill="url(#g2)"/>
  <rect x="590" y="606" width="236" height="200" rx="52" fill="url(#g3)"/>
  <g fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M656 320 L694 356 L762 286"/>
    <path d="M656 708 L694 744 L762 674"/>
  </g>
  <!-- cổng nối -->
  <g fill="#fff">
    <circle cx="390" cy="512" r="20"/><circle cx="590" cy="318" r="20"/><circle cx="590" cy="706" r="20"/>
  </g>
