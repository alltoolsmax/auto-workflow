<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Quản trị Auto WorkFlow · Mr. Huỳnh</title>
<style>
:root{--bg:#070b24;--sf:#0e1438;--sf2:#151d4a;--bd:#26306a;--tx:#eef1ff;--mu:#9aa3d6;--ac:#ff8a1f;--ok:#2fd27a;--bad:#ff5a6a;--warn:#ffc94a;--vid:#22d3ee;--voi:#c084fc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 22px;background:linear-gradient(90deg,#0b1240,#131c55);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header h1{font-size:17px;margin:0}header .sp{flex:1}
select,input,button,textarea{font:inherit;color:var(--tx);background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:8px 11px}
button{cursor:pointer;background:linear-gradient(135deg,var(--ac),#ff6a00);border:none;font-weight:600}
button.g{background:var(--sf2);border:1px solid var(--bd);font-weight:500}button.r{background:#4a1520;border:1px solid #7a2333}
button:hover{filter:brightness(1.12)}
.prod{display:flex;gap:6px}.prod button{background:var(--sf2);border:1px solid var(--bd);font-weight:700}
.prod button.on.video{background:#0e4f63;border-color:var(--vid)}.prod button.on.voice{background:#43206a;border-color:var(--voi)}.prod button.on.gcloud{background:#0b4d3a;border-color:#10b981}
nav{display:flex;gap:6px;padding:12px 22px 0;flex-wrap:wrap}nav a{padding:9px 15px;border-radius:8px 8px 0 0;color:var(--mu);cursor:pointer;text-decoration:none}
nav a.on{background:var(--sf);color:var(--tx);box-shadow:inset 0 2px 0 var(--ac)}
main{background:var(--sf);margin:0 22px 22px;border-radius:0 10px 10px 10px;padding:20px;min-height:60vh;overflow:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:16px}.card b{display:block;font-size:24px;margin-top:4px}.card span{color:var(--mu);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 7px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{color:var(--mu);font-weight:500;position:sticky;top:0;background:var(--sf)}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px}.t-active,.t-paid{background:#123d2a;color:var(--ok)}.t-new,.t-pending{background:#1d2a66;color:#9fb4ff}.t-revoked{background:#4a1520;color:var(--bad)}.t-merged,.t-expired{background:#333;color:#bbb}.t-exp,.t-review{background:#4a3a10;color:var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}.row label{display:flex;flex-direction:column;gap:4px;color:var(--mu);font-size:12.5px}
.mono{font-family:Consolas,monospace}.mu{color:var(--mu)}.k{font-family:Consolas,monospace;font-weight:600;letter-spacing:.5px;word-break:break-all}
#login{max-width:380px;margin:12vh auto;background:var(--sf);padding:28px;border-radius:12px;border:1px solid var(--bd)}#login input{width:100%;margin:12px 0}
pre.made{background:#050819;padding:14px;border-radius:8px;border:1px solid var(--bd);white-space:pre-wrap}
.box{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:18px}.box h3{margin:0 0 10px;font-size:15px}
.acts button{padding:4px 9px;font-size:12px;margin:1px}
#toast{position:fixed;right:20px;bottom:20px;background:var(--sf2);border:1px solid var(--bd);padding:12px 16px;border-radius:8px;display:none;max-width:420px}
</style>
</head><body>
<div id="login"><h2 style="margin:0 0 4px">Quản trị Auto WorkFlow</h2><div class="mu">Cùng mật khẩu với trang quản trị bản quyền</div>
<input id="tok" type="password" placeholder="Mật khẩu quản trị" onkeydown="if(event.key=='Enter')login()"><button onclick="login()" style="width:100%">Đăng nhập</button><div id="lerr" style="color:var(--bad);margin-top:10px"></div></div>
<div id="app" style="display:none">
<header><h1>🔀 Auto WorkFlow · Mr. Huỳnh</h1><span class="sp"></span><a href="./" style="color:var(--mu);text-decoration:none;margin-right:10px">← Quản trị chung</a><button class="g" onclick="logout()">Đăng xuất</button></header>
<nav id="nav"></nav><main id="main"></main></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);const fmt=n=>(n||0).toLocaleString('vi-VN')+'đ';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=t=>t?new Date(t*1000).toLocaleString('vi-VN'):'';const d=t=>t?new Date(t*1000).toLocaleDateString('vi-VN'):'';
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',3200)}
let T='';try{T=sessionStorage.getItem('adm')||''}catch(e){}
const TABS={},R={};let cur='';
async function api(a,body,qs=''){const r=await fetch('awf.php?a='+a+qs,{method:body?'POST':'GET',headers:{'x-admin-token':T,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
 let j;try{j=await r.json()}catch(e){j={ok:false,message:'Máy chủ trả về lỗi '+r.status}}
 if(r.status==401){logout();throw j}if(!j.ok)toast(j.message||'Lỗi');return j}
async function login(){T=$('#tok').value.trim();try{const j=await api('info');if(!j.ok)throw j;try{sessionStorage.setItem('adm',T)}catch(e){};show()}catch(e){$('#lerr').textContent=(e&&e.message)||'Sai mật khẩu'}}
function logout(){T='';try{sessionStorage.removeItem('adm')}catch(e){};$('#app').style.display='none';$('#login').style.display='block'}
function show(){$('#login').style.display='none';$('#app').style.display='block';go(TABS.awf[0][0])}
async function go(t){cur=t;$('#nav').innerHTML=TABS.awf.map(([k,n])=>`<a class="${k==t?'on':''}" onclick="go('${k}')">${n}</a>`).join('');
 const m=$('#main');m.innerHTML='<span class="mu">Đang tải…</span>';try{await R[t](m)}catch(e){m.innerHTML='<span class="mu">'+esc((e&&e.message)||'Lỗi tải')+'</span>'}}
</script>
<script src="awf-admin.js"></script>
<script>if(T)api('info').then(j=>j.ok&&show()).catch(()=>{});</script>
</body></html>
