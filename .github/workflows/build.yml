name: Build Auto WorkFlow

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-awf
  cancel-in-progress: false

# Tệp phát hành có TÊN CỐ ĐỊNH, link .../releases/latest/download/<tên> không bao giờ đổi:
#   auto_workflow_win.exe          · bộ cài Windows (khách cài lần đầu + máy chủ dùng làm bản tự cập nhật)
#   auto_workflow_win.zip          · file nén chứa auto_workflow_win.exe
#   auto_workflow_mac_apple.dmg    · macOS chip Apple (M1/M2/M3...)
#   auto_workflow_mac_intel.dmg    · macOS chip Intel
#   auto_workflow_mac.zip          · file nén chứa cả 2 bộ cài Mac
# Phát hành (giống Video AI / GCloud Hub): tăng "version" trong package.json rồi đẩy lên main → GitHub tự build và tạo
# bản phát hành v<phiên bản>. Máy Mac của khách tự nhận; máy Windows nhận sau khi bấm "Phát hành" ở trang quản trị
# (chọn "Bản Windows GitHub đã build"). Vẫn có thể phát hành bằng tag v1.2.3 như trước.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: win
          - os: macos-15-intel
            name: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cài thư viện
        run: npm install
      - name: Tạo icon từ assets/logo.svg
        run: npm i --no-save sharp png2icons && node tools/make-icons.js
      - name: Lấy số phiên bản từ tag (v1.0.1 -> 1.0.1)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Điền khóa công khai bản quyền (nếu có secret AWF_PUBLIC_KEY)
        shell: bash
        env:
          AWF_PUBLIC_KEY: ${{ secrets.AWF_PUBLIC_KEY }}
        run: node tools/set-pubkey.js
      - name: Build Windows
        if: matrix.name == 'win'
        run: |
          npx electron-builder --win nsis --x64 --publish never
          node tools/make-downloads.js win
          # Bản nén .zip chứa bộ cài .exe (gửi qua Zalo/email không bị chặn file .exe)
          Compress-Archive -Path dist/downloads/auto_workflow_win.exe -DestinationPath dist/downloads/auto_workflow_win.zip -Force
          if (!(Test-Path dist/downloads/auto_workflow_win.zip)) { exit 1 }
      - name: Build macOS
        if: matrix.name == 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          # Đóng gói lần lượt từng loại chip, lỗi tạm "hdiutil: Resource busy" thì thử lại (tối đa 3 lần)
          for ARCH in x64 arm64; do
            for TRY in 1 2 3; do
              npx electron-builder --mac dmg --$ARCH --publish never && break
              [ $TRY = 3 ] && exit 1
              echo "Đóng gói $ARCH lỗi, thử lại lần $((TRY+1))…"; hdiutil info | grep -o '/dev/disk[0-9]*' | sort -u | xargs -n1 hdiutil detach -force 2>/dev/null; sleep 15
            done
          done
          for APP in dist/mac/*.app dist/mac-arm64/*.app; do codesign --verify --deep --strict "$APP"; done
          node tools/make-downloads.js mac
          # Bản nén .zip chứa cả 2 bộ cài Mac (chip Apple + chip Intel)
          (cd dist/downloads && zip -0 auto_workflow_mac.zip auto_workflow_mac_apple.dmg auto_workflow_mac_intel.dmg && unzip -l auto_workflow_mac.zip)
      - name: Đưa lên Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Auto WorkFlow $TAG" --notes "Auto WorkFlow - Mr. Huỳnh $TAG" --target "${{ github.sha }}" || sleep 10
          gh release upload "$TAG" dist/downloads/* --clobber
          gh release edit "$TAG" --latest || true
      - name: Lưu bản build (khi không phát hành)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: auto-workflow-${{ matrix.name }}
          path: dist/downloads/*
